[general]
timeout = "1s"

# float bitwarden popups
[[handler]]
on = "windowtitlev2"
when = "(.*),Extension: .+ Bitwarden"
then = "hyprctl dispatch togglefloating address:0x${REGEX_GROUP_1} && hyprctl dispatch resizewindowpixel -362 -405, address:0x${REGEX_GROUP_1} && hyprctl dispatch centerwindow address:0x${REGEX_GROUP_1}"

# float google sign in popups
[[handler]]
on = "windowtitlev2"
when = "(.*),Sign in - Google Accounts .+"
then = "hyprctl dispatch togglefloating address:0x${REGEX_GROUP_1} && hyprctl dispatch resizewindowpixel -375 -346, address:0x${REGEX_GROUP_1} && hyprctl dispatch centerwindow address:0x${REGEX_GROUP_1}"

# run fuzzel on when special:x is created
[[handler]]
on = "createworkspace"
when = "special:x"
then = "nohup fuzzel &"

# kill fuzzel when special:x is destroyed
[[handler]]
on = "destroyworkspace"
when = "special:x"
then = "killall fuzzel"

# remove weird blurry overlay on popups in winapps apps
[[handler]]
on = "windowtitlev2"
when = "(.*),ActiproWindowChromeShadow"
then = "hyprctl dispatch closewindow address:0x${REGEX_GROUP_1}"
