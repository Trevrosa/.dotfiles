general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = brightnessctl -rd tpacpi::kbd_backlight && hyprctl dispatch dpms on
}

listener {
    timeout = 150
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume  = brightnessctl -rd tpacpi::kbd_backlight
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = hyprlock
}

listener {
    timeout = 600
    on-timeout = discharging || systemctl start suspend-then-poweroff
}
